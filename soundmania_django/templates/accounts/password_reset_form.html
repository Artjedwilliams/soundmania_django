{% extends "base.html" %}
{% block title %}Forgot Password | Sound Mania{% endblock %}
{% block content %}
<main class="simple-page">
    <div class="simple-card">
        <h1>RESET YOUR PASSWORD</h1>
        <p class="subtitle">Enter the email address connected to your account.</p>
        <form method="post">{% csrf_token %}
            <div class="field"><label for="id_email">Email address</label><input type="email" name="email" id="id_email" placeholder="username@example.com" required></div>
            <button class="brush-button"><span>Send Reset Link</span></button>
        </form>
        <p class="switch-copy"><a href="{% url 'login' %}">Back to log in</a></p>
    </div>
</main>
{% endblock %}
